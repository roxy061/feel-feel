# Nginx Reverse Proxy Configuration for Multi-tenant SaaS
# Place this in /etc/nginx/sites-available/feel-feel-saas
# and symlink to /etc/nginx/sites-enabled/

# 1. HTTP -> HTTPS Redirect for All Subdomains
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com *.yourdomain.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Main & Wildcard Subdomains (*.yourdomain.com)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com *.yourdomain.com;

    # SSL Certificate (Let's Encrypt Wildcard Certbot)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Client Request Limits
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Next.js Static Files Cache
    location /_next/static/ {
        alias /var/www/feel-feel-saas/.next/static/;
        expires 365d;
        access_log off;
    }

    # Proxy to Node.js / Next.js running via PM2 on port 3000
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Pass original Host header to let Next.js Middleware extract subdomain!
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
